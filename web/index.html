<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>%F0%9F%94%94</text></svg>">
<style>
  :root {
    --paper:#F1F3F1; --surface:#FBFCFB; --surface-2:#E6EAE7;
    --ink:#151A18; --ink-2:#414A46; --ink-3:#6E7A75;
    --rule:#D2D8D4; --rule-hard:#B4BEB9;
    --ok:#1C6343; --bad:#9E2E23; --warn:#8A5A12;
    --h0:#8A681B; --h1:#2F6B5D; --h2:#3F5A9C; --h3:#71437C; --h4:#8A3F52; --h5:#3F6B8A;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --disp: "Avenir Next Condensed","Avenir Next","Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0D1211; --surface:#141B19; --surface-2:#1B2422;
      --ink:#E6EBE8; --ink-2:#A7B3AE; --ink-3:#76837E;
      --rule:#26312E; --rule-hard:#38443F;
      --ok:#4FB98A; --bad:#E8776A; --warn:#DDA33F;
      --h0:#D6AE52; --h1:#5FB39D; --h2:#7F9BE0; --h3:#C08FCE; --h4:#DE8397; --h5:#7FB2DE;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font: 14px/1.55 var(--mono);
    display:flex; flex-direction:column;
  }
  header {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:11px 18px; border-bottom:1px solid var(--rule-hard); background:var(--surface);
  }
  .brand { font-family:var(--disp); font-weight:700; font-size:17px; letter-spacing:.02em; }
  .lbl { font-family:var(--disp); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:700; }
  .live { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-3); margin-left:auto; }
  .led { width:7px; height:7px; border-radius:50%; background:var(--ink-3); }
  .led.on { background:var(--ok); }
  .strip { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .pill {
    display:inline-flex; align-items:center; gap:6px; font-size:11px;
    padding:3px 9px; border:1px solid var(--rule-hard); border-radius:2px; color:var(--ink-2);
  }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  main { flex:1; display:grid; grid-template-columns: 380px 1fr; min-height:0; }
  .list { border-right:1px solid var(--rule-hard); overflow-y:auto; background:var(--surface); }
  .thread {
    padding:12px 16px; border-bottom:1px solid var(--rule); cursor:pointer;
    border-left:3px solid transparent;
  }
  .thread:hover { background:var(--surface-2); }
  .thread.sel { background:var(--surface-2); border-left-color:var(--ink); }
  .thread .row1 { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .tid { font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st { font-family:var(--disp); font-size:10px; letter-spacing:.1em; font-weight:700; padding:1px 6px; border:1px solid currentColor; border-radius:2px; margin-left:auto; flex:none; }
  .st.OPEN { color:var(--ink-3); }
  .st.RESOLVE { color:var(--ok); }
  .st.ESCALATE { color:var(--warn); }
  .st.DECIDE { color:var(--ok); }
  .last { font-size:12px; color:var(--ink-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meter { display:flex; gap:2px; margin:6px 0 5px; }
  .meter i { flex:1; height:3px; background:var(--rule-hard); border-radius:1px; }
  .meter i.f { background:var(--ink-2); }
  .meter i.hot { background:var(--warn); }
  .who { display:flex; gap:5px; flex-wrap:wrap; margin-top:5px; }
  .who span { font-size:10px; font-weight:700; }
  .pane { overflow-y:auto; padding:0 26px 60px; }
  .pane h2 { font-family:var(--disp); font-size:22px; margin:22px 0 2px; letter-spacing:-.01em; }
  .sub { color:var(--ink-3); font-size:12px; margin-bottom:18px; }
  .msg { padding:13px 0 14px; border-bottom:1px solid var(--rule); }
  .msg .top { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:5px; }
  .agent { font-weight:700; font-size:13px; }
  .type { font-family:var(--disp); font-size:10px; letter-spacing:.1em; font-weight:700; padding:2px 7px; border:1px solid var(--rule-hard); border-radius:2px; color:var(--ink-2); }
  .type.good { color:var(--ok); border-color:var(--ok); }
  .type.bad { color:var(--bad); border-color:var(--bad); }
  .type.warn { color:var(--warn); border-color:var(--warn); }
  .when { font-size:11px; color:var(--ink-3); margin-left:auto; }
  .body { font-size:14px; color:var(--ink-2); white-space:pre-wrap; max-width:76ch; }
  .ask {
    margin-top:9px; padding:8px 11px; font-size:12px;
    border:1px solid var(--warn); border-left-width:3px; border-radius:2px; color:var(--warn);
  }
  .ask b { color:var(--ink); }
  .needs { color:var(--warn); font-size:10px; font-family:var(--disp); letter-spacing:.08em; font-weight:700; }
  .ref { font-size:11px; color:var(--ink-3); margin-top:6px; }
  .ref.stale { color:var(--bad); }
  .empty { color:var(--ink-3); padding:60px 0; text-align:center; }
  .flash { animation: fl 1.1s ease; }
  @keyframes fl { from { background:var(--surface-2); } to { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation:none; } }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } .list { max-height:38vh; } }
</style>
</head>
<body>

<header>
  <span class="brand">agora/span>
  <span class="lbl">leases</span><span class="strip" id="leases"></span>
  <span class="lbl">here</span><span class="strip" id="presence"></span>
  <span class="live"><span class="led" id="led"></span><span id="livetxt">connecting</span></span>
</header>

<main>
  <div class="list" id="list"></div>
  <div class="pane" id="pane"><div class="empty">Select a thread</div></div>
</main>

<script>
const HUES = ['--h0','--h1','--h2','--h3','--h4','--h5'];
const TERMINAL = { RESOLVE:1, ESCALATE:1, DECIDE:1 };
const GOOD = { APPROVE:1, RESOLVE:1, DECIDE:1, CONCEDE:1 };
const BAD  = { DISPUTE:1 };
const WARN = { ESCALATE:1, INTERRUPT:1 };

let HOP_CAP = 8;
const threads = new Map();
let leases = [], presence = new Map();
let selected = null;

function hue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return 'var(' + HUES[h % HUES.length] + ')';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function ago(ts) {
  const s = Math.max(0, (Date.now() - new Date(ts)) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

function ingest(env) {
  if (!env || !env.thread) return false;
  if (!threads.has(env.thread)) threads.set(env.thread, []);
  const arr = threads.get(env.thread);
  if (arr.some(m => m.id === env.id)) return false;
  arr.push(env);
  arr.sort((a, b) => (a.ts < b.ts ? -1 : 1));
  return true;
}

function statusOf(msgs) {
  // A human ruling supersedes whatever closed the thread first — an escalated
  // thread that has since been decided is decided, not still escalated.
  if (msgs.some(m => m.type === 'DECIDE')) return 'DECIDE';
  const t = msgs.find(m => TERMINAL[m.type]);
  return t ? t.type : 'OPEN';
}

function renderList() {
  const rows = [...threads.entries()].map(([id, msgs]) => {
    const hop = msgs.reduce((m, e) => Math.max(m, e.hop || 0), 0);
    // An escalation still waiting on a person is the one thing on this page a
    // human has to act on, so it gets flagged in the list, not just the pane.
    const esc = msgs.find(m => m.type === 'ESCALATE');
    const decided = msgs.some(m => m.type === 'DECIDE');
    const needs = esc && !decided ? (esc.ask_human || 'unclaimed') : null;
    return { id, msgs, hop, status: statusOf(msgs), last: msgs[msgs.length - 1], needs };
  }).sort((a, b) => {
    if (!!a.needs !== !!b.needs) return a.needs ? -1 : 1;   // pending asks float
    return a.last.ts < b.last.ts ? 1 : -1;
  });

  document.getElementById('list').innerHTML = rows.map(r => {
    const who = [...new Set(r.msgs.map(m => m.from && m.from.agent).filter(Boolean))];
    const bars = Array.from({ length: HOP_CAP }, (_, i) =>
      '<i class="' + (i < r.hop ? (r.hop >= HOP_CAP - 1 ? 'f hot' : 'f') : '') + '"></i>').join('');
    return '<div class="thread' + (r.id === selected ? ' sel' : '') + '" data-id="' + esc(r.id) + '">' +
      '<div class="row1"><span class="tid">' + esc(r.id) + '</span>' +
      '<span class="st ' + r.status + '">' + r.status + '</span></div>' +
      '<div class="meter">' + bars + '</div>' +
      '<div class="last">' + esc(r.last.body || r.last.type) + '</div>' +
      '<div class="who">' + who.map(w =>
        '<span style="color:' + hue(w) + '">' + esc(w) + '</span>').join('') +
      (r.needs ? '<span class="needs">ASK: ' + esc(r.needs) + '</span>' : '') +
      '<span style="color:var(--ink-3);margin-left:auto">' + ago(r.last.ts) + '</span></div>' +
      '</div>';
  }).join('') || '<div class="empty">No threads yet</div>';

  document.querySelectorAll('.thread').forEach(el =>
    el.onclick = () => { selected = el.dataset.id; renderList(); renderPane(); });
}

function renderPane(flashId) {
  const pane = document.getElementById('pane');
  if (!selected || !threads.has(selected)) {
    pane.innerHTML = '<div class="empty">Select a thread</div>';
    return;
  }
  const msgs = threads.get(selected);
  const hop = msgs.reduce((m, e) => Math.max(m, e.hop || 0), 0);
  const status = statusOf(msgs);

  pane.innerHTML = '<h2>' + esc(selected) + '</h2>' +
    '<div class="sub">' + status + ' · hop ' + hop + '/' + HOP_CAP + ' · ' +
    msgs.length + ' messages</div>' +
    msgs.map(m => {
      const a = (m.from && m.from.agent) || 'agora';
      const cls = GOOD[m.type] ? ' good' : BAD[m.type] ? ' bad' : WARN[m.type] ? ' warn' : '';
      const ask = m.type === 'ESCALATE'
        ? '<div class="ask">' + (m.ask_human
            ? 'Waiting on a human — <b>' + esc(m.ask_human) + '</b> owes the ask'
            : 'Waiting on a human — <b>nobody was listening</b>, unclaimed') + '</div>'
        : '';
      const refs = (m.refs || []).map(r =>
        '<div class="ref' + (r.stale ? ' stale' : '') + '">ref: ' + esc(r.path) +
        (r.lines ? '#' + esc(r.lines) : '') + ' @' + esc(r.sha256) +
        (r.stale === 'deleted' ? '  [FILE DELETED SINCE]' :
         r.stale ? '  [STALE — file changed since this was written]' : '') + '</div>').join('');
      return '<div class="msg' + (m.id === flashId ? ' flash' : '') + '">' +
        '<div class="top"><span class="agent" style="color:' + hue(a) + '">' + esc(a) + '</span>' +
        '<span class="type' + cls + '">' + esc(m.type) + '</span>' +
        (m.hop ? '<span style="font-size:11px;color:var(--ink-3)">hop ' + m.hop + '</span>' : '') +
        '<span class="when">' + ago(m.ts) + '</span></div>' +
        '<div class="body">' + esc(m.body || '') + '</div>' + ask + refs + '</div>';
    }).join('');
}

function renderStrips() {
  document.getElementById('leases').innerHTML = leases.length
    ? leases.map(l => {
        const left = Math.round((new Date(l.expires_at) - Date.now()) / 60000);
        return '<span class="pill" style="color:' + hue(l.from.agent) + '"><span class="dot"></span>' +
          esc(l.subject.split('/').pop()) + ' · ' + esc(l.from.agent) + ' · ' + left + 'm</span>';
      }).join('')
    : '<span class="pill">none held</span>';

  document.getElementById('presence').innerHTML = presence.size
    ? [...presence.keys()].map(a =>
        '<span class="pill" style="color:' + hue(a) + '"><span class="dot"></span>' + esc(a) + '</span>').join('')
    : '<span class="pill">nobody</span>';
}

async function boot() {
  const r = await fetch('/api/dump');
  const d = await r.json();
  if (d.error) {
    document.getElementById('livetxt').textContent = 'broker unreachable';
    return;
  }
  HOP_CAP = d.hop_cap || 8;
  d.threads.forEach(ingest);
  d.edits.forEach(ingest);
  d.decisions.forEach(ingest);
  leases = d.leases || [];
  (d.presence || []).forEach(p => presence.set(p.from.agent, p));
  if (!selected) {
    const open = [...threads.entries()]
      .sort((a, b) => (a[1][a[1].length - 1].ts < b[1][b[1].length - 1].ts ? 1 : -1));
    if (open.length) selected = open[0][0];
  }
  renderStrips(); renderList(); renderPane();

  const es = new EventSource('/api/stream');
  es.onopen = () => {
    document.getElementById('led').classList.add('on');
    document.getElementById('livetxt').textContent = 'live';
  };
  es.onerror = () => {
    document.getElementById('led').classList.remove('on');
    document.getElementById('livetxt').textContent = 'reconnecting';
  };
  es.onmessage = (ev) => {
    const env = JSON.parse(ev.data);
    if (env._topic === 'bus.presence') { presence.set(env.from.agent, env); return renderStrips(); }
    if (env._topic === 'bus.claims') { fetch('/api/dump').then(r => r.json())
      .then(d => { leases = d.leases || []; renderStrips(); }); return; }
    if (!ingest(env)) return;
    if (!selected) selected = env.thread;
    renderList();
    if (env.thread === selected) renderPane(env.id);
  };
}

setInterval(() => { renderList(); renderStrips(); }, 30000);
boot();
</script>
</body>
</html>
